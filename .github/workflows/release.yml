name: Release Static BEAM

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. OTP-28.5)"
        required: true
        type: string
      git_ref:
        description: "Git ref to release from"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    name: Create tag and draft release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      otp_version: ${{ steps.release.outputs.otp_version }}
      target_sha: ${{ steps.release.outputs.target_sha }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Validate release inputs
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^OTP-[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid release tag: $TAG_NAME"
            echo "::error::Expected OTP-X.Y or OTP-X.Y.Z, for example OTP-28.5"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Tag already exists on origin: $TAG_NAME"
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::GitHub release already exists: $TAG_NAME"
            exit 1
          fi

          OTP_VERSION="${TAG_NAME#OTP-}"
          TARGET_SHA="$(git rev-parse HEAD)"

          {
            echo "tag_name=$TAG_NAME"
            echo "otp_version=$OTP_VERSION"
            echo "target_sha=$TARGET_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          OTP_VERSION: ${{ steps.release.outputs.otp_version }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          GIT_REF: ${{ inputs.git_ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          ALPINE_VERSION="$(grep "FROM alpine:" Dockerfile | head -1 | sed 's/FROM alpine://' | sed 's/ .*//')"

          cat > RELEASE_NOTES.md << EOF
          # Static Erlang/OTP $OTP_VERSION

          Fully static Erlang/OTP binaries built with Alpine Linux and musl libc. The artifacts are built from \`$GIT_REF\` at \`$TARGET_SHA\`.

          ## Build Configuration

          | Parameter | Value |
          |-----------|-------|
          | OTP Version | $OTP_VERSION |
          | Alpine Version | $ALPINE_VERSION |
          | C Library | musl (static) |
          | SSL Library | OpenSSL (static) |
          | Configure Options | \`--enable-static-nifs --enable-static-drivers\` |

          ## Artifacts

          | Architecture | File |
          |--------------|------|
          | x86_64 (Intel/AMD) | \`static-erlang-otp-$OTP_VERSION-linux-amd64.tar.gz\` |
          | arm64 (Apple Silicon, Graviton) | \`static-erlang-otp-$OTP_VERSION-linux-arm64.tar.gz\` |

          ## Quick Start

          \`\`\`bash
          ARCH="amd64" # or "arm64"
          curl -LO "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_NAME/static-erlang-otp-$OTP_VERSION-linux-\${ARCH}.tar.gz"
          tar -xzf "static-erlang-otp-$OTP_VERSION-linux-\${ARCH}.tar.gz"
          sudo rm -rf /opt/erlang
          sudo mv static-erlang /opt/erlang
          /opt/erlang/bin/erl -noshell -eval 'io:format("OTP ~s~n", [erlang:system_info(otp_release)]), halt().'
          \`\`\`
          EOF

      - name: Create tag
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" "$TARGET_SHA" -m "Release $TAG_NAME"
          git push origin "refs/tags/$TAG_NAME"

      - name: Create draft release page
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          OTP_VERSION: ${{ steps.release.outputs.otp_version }}
        run: |
          set -euo pipefail

          gh release create "$TAG_NAME" \
            --verify-tag \
            --draft \
            --title "Static Erlang/OTP $OTP_VERSION" \
            --notes-file RELEASE_NOTES.md

  build-and-upload:
    name: Build and upload (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build static Erlang
        env:
          OTP_VERSION: ${{ needs.create-release.outputs.otp_version }}
        run: |
          set -euo pipefail

          docker build \
            --build-arg "OTP_VERSION=$OTP_VERSION" \
            --target erlang \
            -o ./static-erlang \
            .

      - name: Verify static binaries
        run: |
          set -euo pipefail

          check_static() {
            local binary="$1"
            local name="$2"

            if [ ! -f "$binary" ]; then
              echo "::error::$name not found at $binary"
              exit 1
            fi

            file "$binary"
            ldd_output="$(ldd "$binary" 2>&1 || true)"
            echo "$ldd_output"

            if file "$binary" | grep -qi "statically linked"; then
              return 0
            fi

            if echo "$ldd_output" | grep -qi "not a dynamic executable"; then
              return 0
            fi

            echo "::error::$name is not statically linked"
            exit 1
          }

          BEAM_SMP="$(find static-erlang -name "beam.smp" -type f | head -1)"
          ERLEXEC="$(find static-erlang -name "erlexec" -type f | head -1)"

          check_static "$BEAM_SMP" "beam.smp"
          check_static "$ERLEXEC" "erlexec"

      - name: Verify runtime version
        env:
          OTP_VERSION: ${{ needs.create-release.outputs.otp_version }}
        run: |
          set -euo pipefail

          OTP_MAJOR="${OTP_VERSION%%.*}"
          ACTUAL_VERSION="$(docker run --rm -v "$PWD/static-erlang:/opt/erlang" alpine:3.21 \
            sh -c "cat /opt/erlang/lib/erlang/releases/$OTP_MAJOR/OTP_VERSION")"
          RUNTIME_RELEASE="$(docker run --rm -v "$PWD/static-erlang:/opt/erlang" alpine:3.21 \
            /opt/erlang/bin/erl -noshell -eval 'io:format("~s", [erlang:system_info(otp_release)]), halt().')"

          if [ "$ACTUAL_VERSION" != "$OTP_VERSION" ]; then
            echo "::error::Built OTP $ACTUAL_VERSION, expected $OTP_VERSION"
            exit 1
          fi

          if [ "$RUNTIME_RELEASE" != "$OTP_MAJOR" ]; then
            echo "::error::Runtime OTP release $RUNTIME_RELEASE, expected $OTP_MAJOR"
            exit 1
          fi

      - name: Test portability
        run: |
          set -euo pipefail

          docker run --rm -v "$PWD/static-erlang:/opt/erlang" debian:bookworm-slim \
            /opt/erlang/bin/erl -noshell -eval 'io:format("Erlang ~s on Debian~n", [erlang:system_info(otp_release)]), halt().'

          docker run --rm -v "$PWD/static-erlang:/opt/erlang" alpine:3.21 \
            /opt/erlang/bin/erl -noshell -eval 'io:format("Erlang ~s on Alpine~n", [erlang:system_info(otp_release)]), halt().'

          docker run --rm -v "$PWD/static-erlang:/opt/erlang" busybox:musl \
            /opt/erlang/bin/erl -noshell -eval 'io:format("Erlang ~s on BusyBox~n", [erlang:system_info(otp_release)]), halt().'

          docker run --rm -v "$PWD/static-erlang:/opt/erlang" alpine:3.21 \
            /opt/erlang/bin/erl -noshell -eval '
              application:start(crypto),
              application:start(asn1),
              application:start(public_key),
              application:start(ssl),
              io:format("Crypto and SSL OK~n"),
              halt().
            '

      - name: Package release artifact
        env:
          OTP_VERSION: ${{ needs.create-release.outputs.otp_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          mkdir -p dist
          docker run --rm \
            -e ARCH="$ARCH" \
            -v "$PWD/static-erlang:/opt/erlang:ro" \
            -v "$PWD/scripts:/workspace/scripts:ro" \
            -v "$PWD/dist:/workspace/dist" \
            -w /workspace \
            alpine:3.21 \
            sh -c 'apk add --no-cache bash >/dev/null && ./scripts/collect-build-info.sh /opt/erlang > "dist/BUILD_INFO_${ARCH}.json"'
          tar -czf "dist/static-erlang-otp-${OTP_VERSION}-linux-${ARCH}.tar.gz" static-erlang
          ls -la dist

      - name: Upload artifact to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        run: |
          set -euo pipefail

          gh release upload "$TAG_NAME" dist/* --clobber

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - create-release
      - build-and-upload
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq '.id')"
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest=true
